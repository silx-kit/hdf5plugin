[build-system]
requires = ["py-cpuinfo==9.0.0", "setuptools>=62.4.0", "wheel>=0.34.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hdf5plugin"
authors = [
    {name = "ESRF", email = "silx@esrf.fr"}
]
description = "HDF5 Plugins for Windows, MacOS, and Linux"
readme = "README.rst"
requires-python = ">=3.8"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: BSD License",
    "License :: OSI Approved :: zlib/libpng License",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["h5py>=3.0.0"]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/silx-kit/hdf5plugin"
Documentation = "http://www.silx.org/doc/hdf5plugin/latest/"
Repository = "https://github.com/silx-kit/hdf5plugin"

[project.optional-dependencies]
doc = [
    "ipython",
    "nbsphinx",
    "sphinx",
    "sphinx_rtd_theme",
]
test = [
    "blosc2>=2.5.1;python_version>='3.9'",
    "blosc2-grok>=0.2.2;python_version>='3.9'",
]

[tool.setuptools]
packages = ["hdf5plugin"]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "hdf5plugin._version.version"}

[tool.bandit]
exclude_dirs = [
    "build",
    "doc/hdf5plugin_EuropeanHUG2023",
    "src/bitshuffle",
    "src/bzip2",
    "src/c-blosc",
    "src/c-blosc2",
    "src/charls",
    "src/fcidecomp",
    "src/H5Z-SPERR",
    "src/H5Z-ZFP",
    "src/hdf5-blosc",
    "src/HDF5PLUGIN_Zstandard",
    "src/LZ4",
    "src/lz4_ipp",
    "src/PyTables",
    "src/snappy",
    "src/SPERR",
    "src/SZ",
    "src/SZ3",
    "src/SZ3_extra",
    "src/SZ_extra",
    "src/zfp",
]

[tool.bandit.assert_used]
skips = ["*test.py"]
