name: Python

on:
  push:
  pull_request:

jobs:
  # Builds the pyterse extension for each Python version and runs py_tests/pyterse_test.py.
  pyterse:
    name: ${{ matrix.os }} Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pybind11
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TERSECODEC=OFF
          -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
          -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        # Multi-config generators (Visual Studio) put the module in a Release subdirectory.
        run: |
          export PYTHONPATH="$PWD/build/pyterse/Release:$PWD/build/pyterse"
          python py_tests/pyterse_test.py -v
